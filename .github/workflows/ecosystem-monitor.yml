# Monitor semanal do ecossistema — camada 2 (ADR-020)
# Coleta determinística de releases; abre issue categorizada.
# Telegram/alerta em tempo real: quando notification-service existir.
name: ecosystem-monitor

on:
  schedule:
    - cron: "0 12 * * 1" # segundas 12:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar releases e abrir issue se houver novidades
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ecosystem-monitor.mjs

      - name: Persistir estado (tags já vistas)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ecosystem-monitor-state.json
          git diff --cached --quiet || git commit -m "chore(ecosystem): estado do monitor semanal [skip ci]"
          git push
