name: CI

on:
  push:
  pull_request:
  schedule:
    # Auditoria de segurança semanal (segunda 03:00 UTC) — roda check:security completo
    - cron: "0 3 * * 1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secrets scan
        run: npm run check:secrets

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security check (secrets + dependency audit)
        run: npm run check:security
